[project]
name = "quant-platform"
version = "0.1.0"
description = "Quantitative U.S. equity research and paper-trading platform (benchmark-relative excess-return ranking)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "quant-platform contributors" }]

# --- core runtime (must always be installable; the demo runs on these) ---
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Optional heavy stacks. Installed via `uv sync --extra ml` etc.
ml = [
    "lightgbm>=4.3",
    # Upper bound is a platform constraint, not a preference: torch >=2.12 ships macOS
    # arm64 wheels only for macosx_14_0+, and this project is developed on macOS 13.
    # See docs/adr/0011-optional-vs-required-dependencies.md.
    "torch>=2.3,<2.12",
    "optuna>=3.6",
]
optimization = [
    "cvxpy>=1.5",
]
data = [
    "yfinance>=0.2.40",
    "requests>=2.32",
    "duckdb>=1.0",
]
reporting = [
    "plotly>=5.22",
]
tracking = [
    "mlflow>=2.14",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-requests>=2.32",
    "types-python-dateutil>=2.9",
]

[project.scripts]
quant-platform = "quant_platform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_platform"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "RUF012", # mutable class attributes without ClassVar (pydantic/config heavy)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["quant_platform"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "optional_deps: requires optional heavy dependencies (ml/optimization)",
]

[tool.coverage.run]
source = ["quant_platform"]
branch = true
