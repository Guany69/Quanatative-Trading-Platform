# Experimental temporal Conv1d challenger. Features must be flattened in channel-major order.
model: temporal_conv
channels: 1
lookback: 20
conv_channels: [16, 8]
kernel_size: 3
dropout: 0.2
weight_decay: 0.0001
learning_rate: 0.001
batch_size: 512
max_epochs: 100
patience: 10
device: cpu
use_amp: false
