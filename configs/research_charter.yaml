# Top-level research charter. This is the config `run-demo` and `walk-forward` load.
# A resolved snapshot of this file is persisted with every experiment for reproducibility.
name: default_charter
description: >
  Long-only, benchmark-aware US equity strategy. Predicts 20-session forward
  benchmark-relative excess return and trades the cross-sectional ranking.
random_seed: 42

includes:
  universe: universe.yaml
  costs: costs.yaml
  risk: risk.yaml
  validation: validation.yaml
  backtest: backtest.yaml
  features: features.yaml
  data_sources: data_sources.yaml
  paper_trading: paper_trading.yaml

benchmark:
  preferred_source: sp500_total_return
  fallback_source: spy_adjusted
  symbol: SPY

label:
  # The ranking, not the raw prediction, is the portfolio signal.
  target_type: excess_return_rank
  forecast_horizon_sessions: 20
  label_version: 1.0.0

portfolio:
  long_only: true
  fully_invested: true
  allow_leverage: false
  min_holdings: 50
  max_holdings: 100
  max_position_weight: 0.02
  min_position_weight: 0.0025
  max_sector_deviation: 0.03
  min_beta: 0.90
  max_beta: 1.10
  max_turnover_per_rebalance: 0.15
  max_adv_participation: 0.02
  cash_buffer: 0.0
  min_trade_size: 0.0
  restricted_securities: []
  score_transform: linear
  score_power: 1.0
  score_temperature: 0.20
  allow_constraint_relaxation: true

acceptance_gates:
  min_holdout_net_information_ratio: 0.0
  require_positive_net_excess_at_double_cost: true
  require_beating_factor_baseline: true
  max_single_sector_excess_contribution: 0.5
  max_single_year_excess_contribution: 0.5
  max_drawdown_limit: 0.35
  max_tracking_error: 0.10
  max_annual_turnover: 6.0
  min_deflated_sharpe: 0.0
  max_pbo: 0.5
